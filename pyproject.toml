[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peregrine"
version = "0.1.0"
description = "End-to-end MLOps demo for computer-vision device inference."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Oleksii K." }]
keywords = ["mlops", "computer-vision", "quantization", "edge", "yolo", "device-inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
  "hydra-core>=1.3,<2.0",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]
data = ["dvc[gs]"]
ml = ["ultralytics", "onnxruntime", "tensorflow", "wandb"]

[project.scripts]
peregrine = "peregrine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["peregrine*"]

[tool.setuptools.package-data]
peregrine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "site/dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "ARG", "PTH", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ARG001"]
"**/__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["peregrine"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
  "contract: deterministic offline contract tests (default lane)",
  "laboratory: needs real ML dependencies, GPU, or network; excluded from the default lane",
  "slow: takes more than five seconds",
  "gpu: requires an accelerator",
  "cloud: requires cloud credentials",
  "emulator: requires QEMU",
]
