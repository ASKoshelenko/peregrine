<!doctype html>
<meta charset="utf-8">
<title>QA harness</title>
<style>html,body{margin:0;background:#333}iframe{display:block;border:0;margin:0}</style>
<iframe id="f" src="/"></iframe>
<script>
const p = new URLSearchParams(location.search);
const f = document.getElementById("f");
f.style.width = (p.get("w") || 390) + "px";
f.style.height = (p.get("h") || 640) + "px";
if (p.get("src")) f.src = p.get("src");
</script>
